[project]
name = "rag1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yeturu-surya-fission", email = "surya.yeturu@fissionlabs.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.3",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.16.0",
    "python-dotenv>=1.1.1",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.7.0",
]

[project.scripts]
rag1 = "rag1:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
